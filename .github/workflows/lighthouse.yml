name: Lighthouse

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'pages/**'
      - 'components/**'
      - 'public/**'
      - 'styles/**'
      - 'package*.json'
      - 'scripts/run-lighthouse.mjs'
      - '.github/workflows/lighthouse.yml'

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Public Firebase web config (same values as apphosting.yaml); lib/firebase.ts refuses to load without it.
        # No server secrets are needed: Lighthouse only audits static pages.
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyCQNZwdX8XclqhIxkczKaORSu8ciN0B6oo
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: character-ai-12ae8.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: character-ai-12ae8
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: character-ai-12ae8.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '119066434041'
          NEXT_PUBLIC_FIREBASE_APP_ID: '1:119066434041:web:d5e8672925b11818b40528'
        run: npm run build

      - name: Start server
        run: npm start &

      - name: Wait for server
        run: npx wait-on http://localhost:3000

      - name: Run Lighthouse
        env:
          LIGHTHOUSE_URL: http://localhost:3000
        run: npm run lighthouse

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report.json
